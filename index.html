
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital FoodHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam&family=Mukta:wght@400;500;600;700&family=Rozha+One&display=swap">
<style>
:root{
  /* Layout: one phone-width column (top bar, scrolling page, bottom tabs). Recipe covers are printed like Indian spice-tin labels. */
  --bg:#EDEFEA;
  --surface:#FFFFFF;
  --surface-2:#F5F6F2;
  --ink:#1B1A17;
  --ink-2:#55534C;
  --ink-3:#7E7B73;
  --line:#DADBD3;
  --accent:#E09A0A;
  --accent-ink:#271A00;
  --accent-soft:#FBEDCB;
  --like:#C9381F;
  --good:#2B7743;
  --font-display:"Rozha One","Tiro Devanagari Hindi",Georgia,"Times New Roman",serif;
  --font-body:"Mukta","Hind","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-hand:"Kalam","Segoe Print","Bradley Hand",cursive;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111210;--surface:#1A1B18;--surface-2:#22241F;--ink:#F0EEE7;--ink-2:#BAB7AD;--ink-3:#8F8C82;--line:#30322C;
    --accent:#F2B12E;--accent-ink:#231700;--accent-soft:#3A2E10;--like:#FF6B4F;--good:#5DBE7D;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111210;--surface:#1A1B18;--surface-2:#22241F;--ink:#F0EEE7;--ink-2:#BAB7AD;--ink-3:#8F8C82;--line:#30322C;
  --accent:#F2B12E;--accent-ink:#231700;--accent-soft:#3A2E10;--like:#FF6B4F;--good:#5DBE7D;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.ic{flex:none;vertical-align:middle}

/* shell */
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:25px;line-height:1;background:none;border:0;padding:4px 0;display:flex;align-items:center;gap:3px;color:var(--ink)}
.brand span{background:var(--accent);color:var(--accent-ink);padding:2px 5px 0;border-radius:3px}
.top-sp{flex:1}
.tadka-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;min-height:36px}
.tadka-pill .ic{color:var(--like)}
.me-btn{background:none;border:0;padding:2px;border-radius:50%;min-width:40px;min-height:40px;display:grid;place-items:center}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;font-weight:700;line-height:1;overflow:hidden;background:var(--surface-2)}
#banner:empty{display:none}
.banner{flex:none;padding:9px 16px;font-size:14px;background:var(--accent-soft);border-bottom:1px solid var(--line);color:var(--ink)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px 6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;color:var(--ink-3);padding:4px 0 2px;min-height:50px;justify-content:flex-end;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab-post .plus{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-20px;border:3px solid var(--surface);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.tab-post[aria-current="page"]::before{display:none}

/* type */
.h1{font-family:var(--font-display);font-size:30px;line-height:1.06;font-weight:400}
.h2{font-family:var(--font-display);font-size:22px;line-height:1.12;font-weight:400}
.lead{color:var(--ink-2)}
.hint{font-size:13.5px;color:var(--ink-3)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.sec{padding:12px 16px 4px;display:flex;flex-direction:column;gap:12px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:14.5px;color:var(--ink-2)}
.note b{color:var(--ink)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:15px;min-height:44px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn-sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:inherit}
.link.small{font-size:13px;font-weight:500;color:var(--ink-3)}
.link.danger{color:var(--like)}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:none;border:0;color:var(--ink);text-decoration:none}
.icon-btn.sm{width:36px;height:36px}
.icon-btn.on{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll-x{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.scroll-x::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip-n{color:var(--ink-3);font-weight:500;font-size:13px}
.chip-sm{min-height:32px;padding:3px 10px;font-size:13.5px}
.chip-x .ic{opacity:.7}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink-2);min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg-wide{display:flex}
.seg-wide button{flex:1}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);vertical-align:1px;line-height:1.5}
.tag-promo{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{width:38px;height:38px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
.stepper span{min-width:80px;text-align:center;font-size:14px;font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{min-height:72px;resize:vertical;line-height:1.4}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}

/* diet marks (Indian veg / non-veg labels) */
.diet{display:inline-grid;place-items:center;width:15px;height:15px;border:1.5px solid var(--dc);border-radius:2px;flex:none;background:#fff;vertical-align:-2px}
.diet::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--dc)}
.diet.veg{--dc:#2B7743}
.diet.egg{--dc:#B7790A}
.diet.nonveg{--dc:#8E3B17}
.diet.nonveg::after{width:0;height:0;border-radius:0;background:none;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--dc)}

/* label covers */
.cover{position:relative;container-type:inline-size;background:var(--bg-c);color:var(--fg-c);overflow:hidden;aspect-ratio:4/3;display:flex}
.cover::before{content:"";position:absolute;inset:0;pointer-events:none}
.pat-dots::before{background:radial-gradient(circle,var(--pc) 1.7px,transparent 2.2px) 0 0/12px 12px}
.pat-gingham::before{background:linear-gradient(90deg,var(--pc) 50%,transparent 0) 0 0/18px 18px,linear-gradient(var(--pc) 50%,transparent 0) 0 0/18px 18px}
.pat-jaali::before{background:repeating-linear-gradient(45deg,var(--pc) 0 1.5px,transparent 1.5px 13px),repeating-linear-gradient(-45deg,var(--pc) 0 1.5px,transparent 1.5px 13px)}
.pat-stripes::before{background:repeating-linear-gradient(135deg,var(--pc) 0 7px,transparent 7px 16px)}
.pat-sun::before{background:repeating-conic-gradient(from 0deg at 50% 120%,var(--pc) 0 5deg,transparent 5deg 10deg)}
.cover-frame{position:relative;flex:1;margin:6.5cqi;border:3px double currentColor;border-radius:4px;background:var(--bg-c);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4cqi 6cqi;gap:1.6cqi;min-width:0}
.cover-kicker{font-size:clamp(8.5px,4cqi,13px);letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.86;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover-dish{font-family:var(--font-display);font-size:clamp(16px,10.5cqi,46px);line-height:1.02;text-wrap:balance;overflow-wrap:anywhere}
.cover-sub{font-size:clamp(10px,4.3cqi,16px);line-height:1.2;opacity:.92;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover.photo{background:#222}
.cover.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.photo .cover-frame{visibility:hidden}
.cover.photo::before{display:none}
.sticker{position:absolute;right:4cqi;top:4cqi;width:22cqi;min-width:44px;max-width:84px;aspect-ratio:1;border-radius:50%;background:#FFF6DF;color:#2A1B00;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(9px,3.6cqi,13px);line-height:1.05;transform:rotate(-11deg);border:2px dashed rgba(42,27,0,.45);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.sticker b{font-size:1.25em}
.ribbon{position:absolute;left:0;top:8cqi;background:#1B1A17;color:#FFF6DF;font-size:12px;font-weight:700;padding:3px 9px 2px 7px;display:flex;gap:4px;align-items:center;border-radius:0 4px 4px 0}
.cover.thumb{aspect-ratio:1;width:56px;border-radius:6px}
.cover.thumb .thumb-l{position:relative;margin:auto;font-family:var(--font-display);font-size:26px;line-height:1;background:var(--bg-c);padding:4px 7px 1px;border-radius:3px;border:2px double currentColor}
.cover.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-cover .cover{aspect-ratio:16/10}

/* hero + feed */
.hero{padding:20px 16px 12px;display:flex;flex-direction:column;gap:12px}
.hero-q{font-family:var(--font-display);font-size:clamp(32px,9vw,42px);line-height:1;font-weight:400}
.hero-sub{color:var(--ink-2);font-size:15.5px;max-width:42ch}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:3px 4px 3px 12px}
.searchbar:focus-within{outline:2.5px solid var(--accent);outline-offset:2px}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;font-size:16px;outline:none;min-height:40px}
.searchbar input::-webkit-search-cancel-button{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;min-width:0}
.rcard-body{padding:9px 10px 6px;display:flex;flex-direction:column;gap:2px;flex:1}
.rcard-dish{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);min-width:0}
.rcard-dish span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard-title{font-weight:600;font-size:15px;line-height:1.25}
.rcard-by{font-size:13px;color:var(--ink-2)}
.rcard-meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:5px;align-items:center}
.rcard-eng{display:flex;gap:12px;align-items:center;margin-top:auto;padding-top:4px;font-size:13px;color:var(--ink-2)}
.eng{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;min-height:34px;font-weight:600;color:inherit}
.eng.on{color:var(--like)}
.promo{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.promo .rcard{flex:0 0 58%;scroll-snap-align:start}
.welcome{margin:14px 16px 0;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.role-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:1.5px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.role b{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.1}
.role span{font-size:13.5px;color:var(--ink-2);line-height:1.3}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite linear;border-radius:4px}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink-2)}
.empty h3{font-family:var(--font-display);font-size:22px;font-weight:400;color:var(--ink)}
.empty p{max-width:36ch}

/* search */
.results{display:flex;flex-direction:column}
.group{border-top:2px solid var(--ink);padding-top:10px;margin-top:18px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.group-dish{font-family:var(--font-display);font-size:25px;font-weight:400;line-height:1.1}
.group-n{font-size:13px;color:var(--ink-3)}
.group-foot{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}
.ways{list-style:none}
.way{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.way-rank{font-family:var(--font-display);font-size:22px;line-height:1.1;color:var(--ink-3);text-align:center}
.way.best .way-rank{color:var(--ink)}
.way-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.best-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-ink);background:var(--accent);padding:1px 7px;border-radius:3px;margin-bottom:2px}
.way-title{font-weight:600;line-height:1.25;display:flex;gap:6px;align-items:baseline}
.way-by{font-size:13.5px;color:var(--ink-2)}
.way-meta{font-size:13px;color:var(--ink-3)}
.way-meta b{color:var(--ink);font-weight:600}
.why{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:4px 4px 0 0;color:var(--ink-2);background:var(--surface)}
.way-score{text-align:right;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.way-score b{display:block;font-size:16px;color:var(--ink)}
.cmp-wrap{overflow-x:auto;margin:12px 0 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cmp{border-collapse:collapse;font-size:13.5px;width:100%}
.cmp th,.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.cmp thead th{font-weight:700;min-width:130px;color:var(--ink)}
.cmp tbody th{color:var(--ink-3);font-weight:500;white-space:nowrap;position:sticky;left:0;background:var(--surface)}
.list{list-style:none}
.list-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lr-hit{display:flex;gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer}
.lr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lr-title{font-weight:600;display:flex;gap:6px;align-items:center}
.lr-sub{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.lr-pct{font-weight:700;font-size:14px}
.lr-actions{display:flex}
.match{display:flex;align-items:center;gap:8px;margin-top:4px}
.match-bar{flex:0 0 64px;height:6px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.match-bar span{display:block;height:100%;background:var(--good)}
.match-t{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* recipe sheet */
#sheet{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;background:rgba(0,0,0,.4)}
#sheet[hidden]{display:none}
.sheet{width:100%;max-width:560px;height:100%;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(22px);opacity:.5}to{transform:none;opacity:1}}
.sheet-bar{flex:none;display:flex;align-items:center;gap:2px;padding:4px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-title{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:40px}
.d-head{padding:16px 16px 6px;display:flex;flex-direction:column;gap:5px}
.d-dish{font-family:var(--font-display);font-size:36px;line-height:1;font-weight:400}
.d-title{font-size:18px;color:var(--ink-2);line-height:1.3}
.bestline{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:3px 10px;border-radius:4px}
.rankline{font-size:13.5px;color:var(--ink-2)}
.byline{display:flex;align-items:center;gap:10px;margin-top:8px}
.who{flex:1;min-width:0;display:flex;flex-direction:column}
.who b{font-weight:700;line-height:1.2}
.who span{font-size:13px;color:var(--ink-3)}
.d-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 16px}
.d-stats>div{padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;border-right:1px solid var(--line);text-align:center}
.d-stats>div:last-child{border-right:0}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.v{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:5px}
.v small{font-weight:500;color:var(--ink-3)}
.d-eng{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px 10px}

.cook-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cook-nav .btn{min-height:54px;font-size:17px}

/* rewards */

.wallet::before{left:-11px}
.wallet::after{right:-11px}
.wallet .k{color:inherit;opacity:.7}

.wallet-num{font-family:var(--font-display);font-size:56px;line-height:1}
.wallet-num small{font-family:var(--font-body);font-size:16px;font-weight:600;opacity:.7;margin-left:6px}
.bar{height:8px;background:color-mix(in srgb,var(--surface) 22%,transparent);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.wallet-sub{font-size:14px;opacity:.85}
.wallet-cut{border-top:2px dashed color-mix(in srgb,var(--surface) 30%,transparent);margin:10px 4px 2px}
.wallet-foot{font-size:13.5px}
.wallet-foot span{opacity:.75}
.lb{list-style:none}

.lb .rk{font-family:var(--font-display);font-size:21px;text-align:center;line-height:1}
.lb li.me{background:var(--accent-soft);margin:0 -16px;padding:9px 16px}
.lb .nm{display:flex;flex-direction:column;min-width:0}
.lb .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .nm span{font-size:12.5px;color:var(--ink-3)}
.lb .pts{font-weight:700;font-variant-numeric:tabular-nums}

.badge-d{font-size:12.5px;color:var(--ink-2);line-height:1.25}
.badge-p{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.earn{list-style:none}
.earn li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:15px}
.earn b{font-variant-numeric:tabular-nums;color:var(--good);white-space:nowrap}

.stats4 span{font-size:12px;color:var(--ink-3)}

.order{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:6px}
.order-top{display:flex;gap:10px;align-items:center}
.order-body{font-size:14px;color:var(--ink-2)}
.order-body q{color:var(--ink)}
.status{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}

.orders{display:flex;flex-direction:column;gap:10px}

.ev small{display:block;color:var(--ink-3);font-size:12.5px}
.ev .plus-pts{font-weight:700;color:var(--good);font-size:13.5px;white-space:nowrap}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span:first-child{font-size:14px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ing-edit-head{display:grid;grid-template-columns:62px 84px 1fr 36px;gap:6px}

.step-edit{display:grid;grid-template-columns:28px minmax(0,1fr) 36px;gap:6px;align-items:start}
.step-edit .n{margin-top:8px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:flex;flex-direction:column;gap:12px;background:var(--surface);min-width:0}

.photo-pick{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--r);aspect-ratio:16/9;overflow:hidden;position:relative;cursor:pointer;background:var(--surface-2);color:var(--ink-2);text-align:center;font-weight:600}

.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.photo-pick .ic{display:block;margin:0 auto 4px}
.cover-pick{max-width:240px}
.cover-pick .rcard{pointer-events:none}

.form-actions{display:flex;gap:10px}

.card-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

function searchScore(r, toks, qn) {
  const W = {dish: 6, aka: 5, title: 3, cat: 2, kitchen: 2, ing: 1};
  let total = 0;
  for (const q of toks) {
    let best = 0;
    for (const f in W) for (const t of r.ix[f]) { const m = tokMatch(q, t) * W[f]; if (m > best) best = m; }
    if (!best) return 0;
    total += best;
  }
  if ((' ' + r.ix.dish.join(' ') + ' ').includes(' ' + qn + ' ')) total += 10;
  return total;
}

function ingSuggestions() {
  const c = new Map();
  for (const r of derive().all) for (const x of r.ing) if (!x.staple && x.k) c.set(x.k, (c.get(x.k) || 0) + 1);
  return [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, 60).map(e => e[0]);
}
function quickAdd() {
  const have = new Set(S.have.map(normIng));
  return ['paneer', 'tomato', 'onion', 'potato', 'rice', 'egg', 'chicken', 'curd', 'milk', 'poha', 'besan', 'butter'].filter(n => !have.has(n)).slice(0, 8);
}
function ingResults() {
  if (!S.have.length) return emptyBox('What’s in your kitchen?', 'Add 2 or 3 things from your fridge. We’ll show what you can cook and what’s missing.');
  const have = S.have.map(normIng).filter(Boolean);
  const rows = [];
  for (const r of derive().all) {
    const need = r.ing.filter(x => !(S.assumeStaples && x.staple));
    if (!need.length) continue;
    let got = 0; const miss = [];
    for (const x of need) { if (x.ks.some(k => have.some(h => termMatch(k, h)))) got++; else miss.push(x.k); }
    if (got) rows.push({r, got, total: need.length, miss});
  }
  rows.sort((a, b) => (a.miss.length - b.miss.length) || (b.got / b.total - a.got / a.total) || (b.r.score - a.r.score));
  if (!rows.length) return emptyBox('No matches yet', 'None of the recipes use those. Try adding a few more basics like onion or tomato.');
  return `<ul class="list">${rows.slice(0, 30).map(({r, got, total, miss}) => `<li class="list-row"><div class="lr-hit" role="button" tabindex="0" data-act="open" data-id="${esc(r.id)}">
    ${cover(r, 'thumb')}
    <div class="lr-main">
      <div class="lr-title">${dietMark(r.diet)} ${esc(r.dish)}</div>
      <div class="lr-sub">${esc(r.title)} · ${esc(kitchenName(r))}</div>
      <div class="match"><span class="match-bar"><span style="width:${Math.round(got / total * 100)}%"></span></span><span class="match-t">${miss.length ? `Need ${miss.length}: ${esc(miss.slice(0, 4).join(', '))}${miss.length > 4 ? '…' : ''}` : 'You have everything'}</span></div>
    </div>
    <span class="lr-pct num" aria-label="${got} of ${total} ingredients">${got}/${total}</span></div></li>`).join('')}</ul>`;
}

function marketBox(r, mine) {

  const area = r.sell && r.sell.area ? `${ic('pin', 13)}${esc(r.sell.area)}` : '';

  const g = derive().groups.get(k);

}

function badgesFor(uid) {
  const d = derive();
  const mine = d.all.filter(r => r.owner === uid);
  const sum = f => mine.reduce((a, r) => a + f(r), 0);
  const likesIn = sum(r => r.st.L.filter(x => x.u !== uid).length);
  const madeIn = sum(r => r.st.M.filter(x => x.u !== uid).length);
  const ordersIn = sum(r => r.st.O.filter(x => x.u !== uid).length);
  const m = S.members[uid] || sanMember({});
  const madeOut = new Set(m.made.filter(x => { const r = d.byId.get(x.r); return r && r.owner !== uid; }).map(x => x.r)).size;
  const commented = new Set(m.comments.filter(c => { const r = d.byId.get(c.r); return r && r.owner !== uid; }).map(c => c.r)).size;
  return [
    {k: 'Pehla Post', d: 'Post your first recipe', have: mine.length, need: 1},
    {k: 'Dil Jeet Liya', d: '25 likes on your recipes', have: likesIn, need: 25},
    {k: 'Crowd Favourite', d: '100 likes on your recipes', have: likesIn, need: 100},
    {k: 'Ghar Ghar Mein', d: '5 people made your recipes', have: madeIn, need: 5},
    {k: 'Taste Tester', d: 'Cook 3 recipes by others', have: madeOut, need: 3},
    {k: 'Chatterbox', d: 'Comment on 5 recipes', have: commented, need: 5},
    {k: 'Dukaan Open', d: 'List a dish or kit for sale', have: mine.some(r => r.sell || r.kit) ? 1 : 0, need: 1},
    {k: 'Pehla Order', d: 'Get your first order', have: ordersIn, need: 1},
    {k: 'Best Way', d: 'Rank #1 for a dish with 2+ ways', have: mine.some(r => r.rank === 1 && r.ways > 1) ? 1 : 0, need: 1}
  ];
}
function leaderboard() {
  const since = S.lbTab === 'week' ? now() - 7 * DAY : 0;
  const rows = [];
  const ids = new Set([...Object.keys(S.members), ...Object.keys(S.kitchens)]);
  if (S.me) ids.add(S.me);
  for (const uid of ids) {
    const p = pointsFor(uid, since);
    if (p.total > 0 || uid === S.me) rows.push({uid, pts: p.total, lv: levelOf(since ? pointsFor(uid).total : p.total).cur.n, city: (S.members[uid] || {}).city || ''});
  }
  if (!since && !S.config.hideSamples) {
    const ks = new Map();
    for (const s of S.starters) { const k = ks.get(s.kitchen) || {sample: s.kitchen, city: s.city, pts: 0}; k.pts += PTS.post + PTS.likeIn * s.base.likes + PTS.madeIn * s.base.made; ks.set(s.kitchen, k); }
    for (const k of ks.values()) rows.push({...k, lv: levelOf(k.pts).cur.n});
  }
  rows.sort((a, b) => b.pts - a.pts);
  rows.forEach((r, i) => r.rank = i + 1);
  let shown = rows.slice(0, 15);
  const meRow = rows.find(r => r.uid && r.uid === S.me);
  if (meRow && !shown.includes(meRow)) shown = [...shown, meRow];
  if (!shown.length || (since && !rows.some(r => r.pts > 0))) return emptyBox('No Tadka earned this week yet', 'Post a recipe or cook one to take the #1 spot.');
  return `<ol class="lb">${shown.map(r => {
    const name = r.sample ? r.sample : displayName(r.uid);
    return `<li class="${r.uid && r.uid === S.me ? 'me' : ''}"><span class="rk">${r.rank}</span>${r.sample ? initialAv(r.sample, 36, hashStr(r.sample)) : avatar(r.uid, 36)}
      <span class="nm"><b>${esc(name)}${r.uid === S.me ? ' (you)' : ''}</b><span>${esc(r.lv)}${r.city ? ' · ' + esc(r.city) : ''}${r.sample ? ' · Sample' : ''}</span></span>
      <span class="pts">${fmtNum(r.pts)}</span></li>`;
  }).join('')}</ol>`;
}

function orderCard(o, asSeller) {

  return `<div class="order"><div class="order-top">${who}<span class="status ${st}">${STATUS_LABEL[st]}</span></div>
    <div class="order-body">${o.qty} × ${r ? esc(r.dish) : 'item'}${o.kind === 'kit' ? ' ingredient kit' : ''}${total ? ' · <b>' + total + '</b>' : ''}${o.when ? ' · for ' + esc(o.when) : ''}${o.note ? `<br><q>${esc(o.note)}</q>` : ''}</div>

function activity() {
  const d = derive(); const ev = [];
  for (const r of d.all) {

    for (const l of r.st.L) if (l.u !== S.me) ev.push({u: l.u, at: l.at, t: 'liked', r, p: PTS.likeIn});
    for (const c of r.st.C) if (c.u !== S.me) ev.push({u: c.u, at: c.at, t: 'commented on', r, p: PTS.commentIn, x: c.t});
    for (const m of r.st.M) if (m.u !== S.me) ev.push({u: m.u, at: m.at, t: 'made', r, p: PTS.madeIn, x: '★'.repeat(m.s)});
    for (const o of r.st.O) if (o.u !== S.me) ev.push({u: o.u, at: o.at, t: o.kind === 'kit' ? 'ordered a kit for' : 'ordered', r, p: PTS.orderIn});
  }
  for (const f of (d.followers.get(S.me) || [])) ev.push({u: f.u, at: f.at, t: 'followed your kitchen', p: PTS.follower});

/* ---------- render ---------- */
const VIEWS = {home: vHome, search: vSearch, post: vPost, rewards: vRewards, me: vMe};
let queued = false, last = {main: '', tab: '', sheet: '', modal: '', cook: '', banner: '', open: null};

function bump() { dataVersion++; scheduleRender(); }
function captureFocus() {

}

}

}
function render() {

    <button class="tadka-pill" data-act="tab" data-tab="rewards" aria-label="Tadka points: ${p ? p.balance : 0}">${ic('flame', 17, true)}<span class="num">${p ? fmtNum(p.balance) : '0'}</span></button>
    <button class="me-btn" data-act="tab" data-tab="me" aria-label="Your kitchen">${S.me ? avatar(S.me, 32) : initialAv('?', 32, 3)}</button>`);
  let banner = '';
  if (S.slow) banner = 'Can’t reach the hub right now. What you see may be out of date.';
  else if (S.status === 'loading' && S.readOnly) banner = S.me ? 'You’re browsing. To post, like or comment, ask the hub’s owner for edit access.' : 'Sign in to claude.ai to post, like and comment.';
  swap($('#banner'), 'banner', banner ? `<div class="banner" role="status">${esc(banner)}</div>` : '');
  // main
  const main = $('#main');
  const sameTab = last.tab === S.tab;
  const scroll = main.scrollTop;
  swap(main, 'main', VIEWS[S.tab]());
  main.scrollTop = sameTab ? scroll : 0;
  last.tab = S.tab;
  swap($('#tabs'), 'tabs', TAB_DEF.map(([k, l, icon]) => k === 'post'
    ? `<button class="tab tab-post" data-act="tab" data-tab="post" aria-current="${S.tab === 'post' ? 'page' : 'false'}"><span class="plus">${ic('plus', 24)}</span>${l}</button>`
    : `<button class="tab" data-act="tab" data-tab="${k}" aria-current="${S.tab === k ? 'page' : 'false'}">${ic(icon, 22)}${l}</button>`).join(''));
  // recipe sheet
  const sheet = $('#sheet');
  if (S.open) {
    const body = $('#sheet-body');
    const sc = body && last.open === S.open ? body.scrollTop : 0;
    const fresh = last.open !== S.open;
    sheet.hidden = false;
    swap(sheet, 'sheet', vDetail(S.open));
    const nb = $('#sheet-body'); if (nb) nb.scrollTop = sc;

}
function refreshLive(which) {

/* ---------- writing (each person writes only their own documents) ---------- */
function canAct() {
  if (S.status !== 'loading' || !S.db) { toast('The hub isn’t connected here.'); return false; }
  if (!S.me) { toast('Sign in to claude.ai to join in.'); return false; }
  if (S.readOnly) { toast('You can browse, but posting and reacting need edit access from the hub’s owner.'); return false; }
  if (!(S.def.members && S.def.kitchens)) { toast('Still loading the hub. Try again in a moment.'); return false; }
  return true;
}
function payloadOf(coll) {
  return coll === 'members' ? {...S.members[S.me], v: 1} : {recipes: S.kitchens[S.me].recipes.map(storeRecipe)};
}
function saveMine(coll, fields) {
  const store = coll === 'members' ? S.members : S.kitchens;
  const cur = store[S.me] || (coll === 'members' ? sanMember({}) : {recipes: []});
  const merged = {...cur, ...fields};
  const local = coll === 'members' ? sanMember(merged) : sanKitchen({recipes: merged.recipes.map(r => r.ks ? storeRecipe(r) : r)});
  const size = JSON.stringify(coll === 'members' ? local : {recipes: local.recipes.map(storeRecipe)}).length;
  if (size > 240000) { toast(coll === 'kitchens' ? 'Your kitchen is full. Delete an old recipe to post more.' : 'Your activity history is full.'); return false; }
  store[S.me] = local;
  pending[coll]++;
  bump();
  Q[coll] = Q[coll].then(() => doWrite(coll, fields)).catch(err => writeFailed(coll, err)).finally(() => { pending[coll]--; });
  return true;
}
async function doWrite(coll, fields, retried) {
  const ref = S.db.collection(coll).doc(S.me);
  try {
    if (!exists[coll]) { const snap = await ref.get(); if (snap && snap.exists) exists[coll] = true; }
    if (exists[coll]) await ref.update(JSON.parse(JSON.stringify(fields)));
    else { await ref.set(JSON.parse(JSON.stringify({...payloadOf(coll), joined: now()}))); exists[coll] = true; }
  } catch (e) {
    if (!retried && e && e.code === 'unavailable') { await sleep(600 + Math.random() * 900); return doWrite(coll, fields, true); }
    throw e;
  }
}
function writeFailed(coll, err) {
  const code = err && err.code;
  const store = coll === 'members' ? S.members : S.kitchens;
  if (serverMine[coll]) store[S.me] = serverMine[coll]; else delete store[S.me];
  if (code === 'invalid_argument' && S.canWrite !== true) { S.readOnly = true; toast('You can browse, but posting and reacting need edit access from the hub’s owner.'); }
  else if (code === 'quota_exceeded') toast('The hub is out of space. The owner needs to clear old data.');
  else if (code === 'resource_exhausted') toast('Too many actions at once. Wait a few seconds and try again.');
  else if (code === 'revoked') { S.readOnly = true; toast('Your access to this hub changed.'); }
  else toast('Couldn’t save that. Check your connection and try again.');
  bump();
}
function writeSaves(ids) {
  if (!S.db || !S.me) { toast('Sign in to save recipes.'); return; }
  const before = S.saves;
  S.saves = ids; pending.saves++; bump();
  Q.saves = Q.saves.then(() => S.db.doc('data/users/' + S.me + '/saves').set({ids, at: now()}))
    .catch(() => { S.saves = before; toast('Couldn’t save that recipe.'); bump(); })
    .finally(() => { pending.saves--; });
}
function uploadMsg(e) {
  const c = e && e.code;

    : c === 'quota_or_state' ? 'Photo storage for this hub is full. Publish without a photo.' : c === 'rate_limited' ? 'Too many uploads. Wait a minute and try again.'
    : 'Couldn’t upload the photo. Try again, or publish without it.';
}
async function compressImage(file) {
  let bmp = null;
  try { bmp = await createImageBitmap(file); } catch (e) { return file; }
  const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);

/* ---------- timers + cook mode ---------- */
let timerInt = 0, audioCtx = null, wakeLock = null;
function tickTimer() {
  const box = $('#timer'), t = S.timer;

  const left = Math.max(0, Math.round((t.end - now()) / 1000));
  if (!left && !t.done) { t.done = true; beep(); }
  box.hidden = false;
  box.classList.toggle('done', t.done);
  box.querySelector('.t-left').textContent = t.done ? 'Time’s up!' : fmtClock(left);

function beep() {
  try {
    if (!audioCtx) return;
    [0, 0.35, 0.7].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const st = audioCtx.currentTime + off;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.3, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.25);
      o.start(st); o.stop(st + 0.3);

}

  try {
    if (on && 'wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');

  } catch (e) { wakeLock = null; }
}

      ing: r.ing.map(i => ({q: i.q == null ? '' : String(i.q), u: i.u, n: i.n})), steps: [...r.steps], tip: r.tip, aka: r.aka.join(', '),
      sellOn: !!r.sell, sell: r.sell ? {price: String(r.sell.price), per: r.sell.per, area: r.sell.area, note: r.sell.note} : {price: '', per: 'plate', area: '', note: ''},
      kitOn: !!r.kit, kit: r.kit ? {price: String(r.kit.price), has: r.kit.has} : {price: '', has: ''}, photo: r.photo, cover: r.cover || coverIdx(r)};
    S.editing = r.id; S.formErr = ''; go('post');
  },
  'cancel-edit': () => { S.editing = null; S.draft = newDraft(); S.formErr = ''; scheduleRender(); },
  'del-recipe': el => {
    if (!canAct()) return;
    const id = el.dataset.id;
    askConfirm('Delete this recipe?', 'Its likes, comments and ratings stop showing. This can’t be undone.', 'Delete', () => {
      const r = myKitchen().recipes.find(x => x.id === id);
      if (saveMine('kitchens', {recipes: myKitchen().recipes.filter(x => x.id !== id).map(storeRecipe)})) {
        if (r && r.photo && S.assets) S.assets.delete(r.photo).catch(() => {});
        if (S.open === id) closeRecipe();
        toast('Recipe deleted');
      }
    });
  },
  'ing-add': () => { if (S.draft.ing.length < 40) S.draft.ing.push({q: '', u: '', n: ''}); scheduleRender(); },
  'ing-rm': el => { S.draft.ing.splice(+el.dataset.i, 1); if (!S.draft.ing.length) S.draft.ing.push({q: '', u: '', n: ''}); scheduleRender(); },
  'step-add': () => { if (S.draft.steps.length < 25) S.draft.steps.push(''); scheduleRender(); },
  'step-rm': el => { S.draft.steps.splice(+el.dataset.i, 1); if (!S.draft.steps.length) S.draft.steps.push(''); scheduleRender(); },
  'draft-diet': el => { S.draft.diet = DIETS[el.dataset.v] ? el.dataset.v : 'veg'; scheduleRender(); },
  'cover-p': el => { S.draft.cover = {...(S.draft.cover || {t: 0}), p: +el.dataset.v}; scheduleRender(); },
  'cover-t': el => { S.draft.cover = {...(S.draft.cover || {p: 0}), t: +el.dataset.v}; scheduleRender(); },
  'photo-rm': () => { if (S.draft.photoPreview) URL.revokeObjectURL(S.draft.photoPreview); S.draft.photoBlob = null; S.draft.photoPreview = ''; S.draft.photo = null; scheduleRender(); }
};
function coverIdx(r) { const c = coverOf(r); return {p: PAL.indexOf(c.p), t: PATS.indexOf(c.t)}; }
function openMade(id) {
  if (!canAct()) return;
  const prev = myMadeOf(id);
  S.modal = {type: 'made', id, s: prev ? prev.s : 0, n: prev ? prev.n : '', edit: !!prev};
  scheduleRender();
}
function addHave(v) {
  const parts = String(v || '').split(',').map(s => clean(s, 30).toLowerCase()).filter(Boolean);
  for (const p of parts) if (!S.have.some(h => normIng(h) === normIng(p)) && S.have.length < 20) S.have.push(p);
  scheduleRender();
}
const FORMS = {
  hero: () => { S.q = S.heroQ; S.mode = 'dish'; S.compare = null; go('search'); },
  search: () => { const el = $('#q'); if (el) el.blur(); },
  have: () => { addHave(S.haveIn); S.haveIn = ''; scheduleRender(); },
  comment: form => {
    const id = form.dataset.id; if (!canAct()) return;
    const t = String(S.cdraft[id] || '').trim().slice(0, 500);
    if (!t) { toast('Write something first.'); return; }
    const r = derive().byId.get(id); if (!r) return;
    const first = !myMember().comments.some(c => c.r === id);
    if (saveMine('members', {comments: [...myMember().comments, {id: newId('c'), r: id, t, at: now()}]})) {
      S.cdraft[id] = '';
      toast(first && r.owner !== S.me ? `Comment posted · +${PTS.commentOut} Tadka` : 'Comment posted');
    }
  },
  profile: () => {
    if (!canAct()) return;
    const pf = S.pf || {};
    if (saveMine('members', {kitchen: clean(pf.kitchen, 40), city: clean(pf.city, 40), bio: clean(pf.bio, 160)})) { S.pf = null; toast('Profile saved'); scheduleRender(); }
  },
  post: () => submitPost()
};
async function submitPost() {
  if (S.busy || !canAct()) return;
  const dr = S.draft;
  const fail = msg => { S.formErr = msg; S.busy = false; scheduleRender(); requestAnimationFrame(() => { const el = $('#form-err'); if (el) el.scrollIntoView({block: 'center', behavior: 'smooth'}); }); };
  const m = myMember();
  if (!m.kitchen && !clean(dr.kitchen, 40)) return fail('Give your kitchen a name. It shows on your recipes.');
  const title = clean(dr.title, 80);
  let dish = clean(dr.dish, 60);
  if (!dish) return fail('Add the dish name.');
  const known = derive().groups.get(dishKey(dish));
  if (known) dish = known.dish;
  else if (dish === dish.toLowerCase()) dish = dish.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  if (!title) return fail('Add what makes your version different, like “Dhaba-style”.');
  const ing = dr.ing.map(x => ({q: parseQty(x.q), u: UNITS.includes(x.u) ? x.u : '', n: clean(x.n, 80)})).filter(x => x.n);
  if (ing.length < 2) return fail('Add at least 2 ingredients.');
  const steps = dr.steps.map(s => clean(s, 600)).filter(Boolean);
  if (!steps.length) return fail('Add at least one step to the method.');
  let sell = null, kit = null;
  if (dr.sellOn) { const p = clampInt(dr.sell.price, 0, 100000, 0); if (!p) return fail('Add a price for the dish, or turn off “Take orders”.'); sell = {price: p, per: clean(dr.sell.per, 40) || 'plate', area: clean(dr.sell.area, 60), note: clean(dr.sell.note, 80)}; }
  if (dr.kitOn) { const p = clampInt(dr.kit.price, 0, 100000, 0); if (!p) return fail('Add a price for the kit, or turn it off.'); kit = {price: p, has: clean(dr.kit.has, 100) || 'Ingredient kit'}; }
  S.formErr = ''; S.busy = true; scheduleRender();
  let photo = validAsset(dr.photo);
  if (dr.photoBlob && S.assets) {
    try { const res = await S.assets.upload(dr.photoBlob, {type: dr.photoBlob.type || 'image/jpeg'}); photo = validAsset(res && res.id); }
    catch (e) { return fail(uploadMsg(e)); }
  }
  const id = S.editing || newId('r');
  const old = myKitchen().recipes.find(r => r.id === id);
  const rec = {id, dish, title, cat: CATS.includes(dr.cat) ? dr.cat : 'Main course', diet: DIETS[dr.diet] ? dr.diet : 'veg', level: LEVELS_COOK.includes(dr.level) ? dr.level : 'Easy',
    mins: clampInt(dr.mins, 1, 1440, 30), serves: clampInt(dr.serves, 1, 50, 2), cost: clampInt(dr.cost, 0, 100000, 0),
    aka: String(dr.aka || '').split(',').map(s => clean(s, 30)).filter(Boolean).slice(0, 6), ing: ing.slice(0, 40), steps: steps.slice(0, 25), tip: clean(dr.tip, 300),
    photo: photo || null, cover: {p: clampInt(dr.cover && dr.cover.p, 0, PAL.length - 1, 0), t: clampInt(dr.cover && dr.cover.t, 0, PATS.length - 1, 0)}, sell, kit, at: old ? old.at : now()};
  if (old) rec.edited = now();
  if (!m.kitchen) saveMine('members', {kitchen: clean(dr.kitchen, 40), city: clean(dr.city, 40), role: m.role || 'cook'});
  const ok = saveMine('kitchens', {recipes: [...myKitchen().recipes.filter(r => r.id !== id).map(storeRecipe), rec]});
  S.busy = false;
  if (!ok) { scheduleRender(); return; }
  if (old && old.photo && old.photo !== rec.photo && S.assets) S.assets.delete(old.photo).catch(() => {});
  if (dr.photoPreview) URL.revokeObjectURL(dr.photoPreview);
  const wasEdit = !!S.editing;
  S.editing = null; S.draft = newDraft(); S.formErr = '';
  toast(wasEdit ? 'Recipe updated' : `Published! +${PTS.post} Tadka`);
  S.tab = 'home';
  openRecipe(id);
}

/* ---------- events ---------- */
function setPath(o, path, v) {
  const ks = path.split('.');
  let cur = o;
  for (let i = 0; i < ks.length - 1; i++) {
    const k = ks[i];
    if (k === '__proto__' || k === 'constructor' || k === 'prototype') return;
    if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    cur = cur[k];
  }
  const lk = ks[ks.length - 1];
  if (lk === '__proto__' || lk === 'constructor' || lk === 'prototype') return;
  cur[lk] = v;
}
function bindEvents() {
  document.addEventListener('click', e => {
    if (e.target.id === 'modal') { S.modal = null; scheduleRender(); return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'BUTTON' || el.getAttribute('role') === 'button') e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (S.modal) { S.modal = null; scheduleRender(); }
      else if (S.cook) ACT['cook-close']();
      else if (S.open) closeRecipe();
      return;
    }
    if (S.cook && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { ACT['cook-step']({dataset: {d: e.key === 'ArrowRight' ? '1' : '-1'}}); return; }
    const el = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.act && el.tagName !== 'BUTTON') { e.preventDefault(); el.click(); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset && el.dataset.bind) {
      setPath(S, el.dataset.bind, el.value);
      last.main = '';
      if (el.dataset.live) refreshLive(el.dataset.live);
    }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.check) { setPath(S, el.dataset.check, el.checked); scheduleRender(); return; }
    if (el.dataset.photo) { handlePhoto(el); return; }
    if (el.dataset.setting === 'samples') { setSamples(el.checked); return; }
    if (el.name === 'boost' && S.modal) { S.modal.id = el.value; S.modal.err = ''; scheduleRender(); return; }
    if (el.tagName === 'SELECT' && el.dataset.bind) { setPath(S, el.dataset.bind, el.value); last.main = ''; }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = FORMS[e.target.dataset.form];
    if (f) f(e.target);
  });
  document.addEventListener('error', e => {
    const t = e.target;
    if (t && t.tagName === 'IMG' && t.dataset.fb) { const c = t.closest('.cover'); if (c) c.classList.remove('photo'); t.remove(); }
  }, true);
  window.addEventListener('hashchange', applyHash);
}
async function handlePhoto(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { toast('Choose a JPG, PNG or WebP photo.'); return; }
  try {
    const blob = await compressImage(file);
    if (S.draft.photoPreview) URL.revokeObjectURL(S.draft.photoPreview);
    S.draft.photoBlob = blob; S.draft.photoPreview = URL.createObjectURL(blob);
    scheduleRender();
  } catch (e) { toast('Couldn’t read that photo. Try another.'); }
}
async function setSamples(show) {
  if (!S.isOwner || !S.db) return;
  try { await S.db.doc('config/hub').set({hideSamples: !show, at: now()}); toast(show ? 'Sample recipes are showing' : 'Sample recipes are hidden'); }
  catch (e) { toast('Couldn’t change that setting.'); scheduleRender(); }
}

/* ---------- connecting to the shared store ---------- */
function markLoaded(k, snap) {
  S.loaded[k] = true;
  if (!snap || !snap.metadata || !snap.metadata.fromCache) S.def[k] = true;
  if (S.def.starter && S.def.members && S.def.kitchens) { S.slow = false; clearTimeout(S.slowTimer); }
}
function subscribe() {
  const db = S.db;
  S.slowTimer = setTimeout(() => { if (!(S.def.starter && S.def.members && S.def.kitchens)) { S.slow = true; scheduleRender(); } }, 10000);
  const onErr = k => e => {
    S.loaded[k] = true;
    if (k === 'starter' || k === 'members' || k === 'kitchens') { S.slow = true; clearTimeout(S.slowTimer); }
    if (e && e.code === 'revoked') S.readOnly = true;
    bump();
  };
  try {
    db.collection('starter').onSnapshot(snap => {
      S.starters = snap.docs.filter(d => d.exists).map(d => sanRecipe({...d.data(), id: d.id}, true)).filter(Boolean);
      markLoaded('starter', snap); bump();
    }, onErr('starter'));
    db.collection('members').onSnapshot(snap => {
      const next = {};
      for (const d of snap.docs) if (d.exists) next[d.id] = sanMember(d.data());
      if (S.me) {
        if (next[S.me]) exists.members = true;
        serverMine.members = next[S.me] || null;
        if (pending.members > 0 && S.members[S.me]) next[S.me] = S.members[S.me];
      }
      S.members = next; markLoaded('members', snap); bump();
    }, onErr('members'));
    db.collection('kitchens').onSnapshot(snap => {
      const next = {};
      for (const d of snap.docs) if (d.exists) next[d.id] = sanKitchen(d.data());
      if (S.me) {
        if (next[S.me]) exists.kitchens = true;
        serverMine.kitchens = next[S.me] || null;
        if (pending.kitchens > 0 && S.kitchens[S.me]) next[S.me] = S.kitchens[S.me];
      }
      S.kitchens = next; markLoaded('kitchens', snap); bump();
    }, onErr('kitchens'));
    db.doc('config/hub').onSnapshot(d => { S.config = d.exists ? (d.data() || {}) : {}; markLoaded('config', d); bump(); }, onErr('config'));
    if (S.me) db.doc('data/users/' + S.me + '/saves').onSnapshot(d => {
      if (!pending.saves) S.saves = d.exists ? arr((d.data() || {}).ids).filter(x => typeof x === 'string' && RID.test(x)) : [];
      markLoaded('saves', d); bump();
    }, onErr('saves'));
  } catch (e) { S.slow = true; bump(); }
}
async function connect() {
  for (let i = 0; i < 30 && !(window.claude && typeof window.claude.use === 'function'); i++) await sleep(100);
  const c = window.claude;
  const use = n => { try { return Promise.resolve(c.use(n)).catch(() => null); } catch (e) { return Promise.resolve(null); } };
  if (!c || typeof c.use !== 'function') { S.status = 'none'; scheduleRender(); return; }
  const [db, user, assets] = await Promise.all([use('db'), use('user'), use('assets')]);
  S.db = db; S.user = user; S.assets = assets;
  if (user) {
    try { const me = await user.me(); S.me = (me && me.id) || null; S.meInfo = me; S.isOwner = !!(me && me.isOwner); } catch (e) { S.me = null; }
    try { S.canWrite = await user.can('data.write'); } catch (e) { S.canWrite = null; }
  }
  if (!db) { S.status = 'none'; scheduleRender(); return; }
  S.status = 'loading';
  if (!S.me || S.canWrite === false) S.readOnly = true;
  subscribe();
  bump();
}

/* ---------- boot ---------- */
function hotState() { return {tab: S.tab, open: S.open, q: S.q, mode: S.mode, have: S.have, feedCat: S.feedCat, editing: S.editing, draft: {...S.draft, photoBlob: null, photoPreview: ''}}; }
function start(hot) {
  const h = hot && typeof hot === 'object' ? hot : {};
  if (TABS.includes(h.tab)) S.tab = h.tab;
  if (typeof h.q === 'string') S.q = h.q;
  if (h.mode === 'ing') S.mode = 'ing';
  if (Array.isArray(h.have)) S.have = h.have.filter(x => typeof x === 'string').slice(0, 20);
  if (typeof h.feedCat === 'string') S.feedCat = h.feedCat;
  if (h.draft && typeof h.draft === 'object' && Array.isArray(h.draft.ing) && Array.isArray(h.draft.steps)) { S.draft = {...newDraft(), ...h.draft, photoBlob: null, photoPreview: ''}; if (typeof h.editing === 'string') S.editing = h.editing; }
  bindEvents();
  applyHash();
  render();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(hotState); } catch (e) { /* ignore */ }
  connect();
  setInterval(() => { if (!document.hidden) bump(); }, 60000);
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
